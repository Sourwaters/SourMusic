<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><title>SourMusic — совместное воспроизведение</title>
<link rel="stylesheet" href="brand.css?v=12"><style>main{max-width:820px}.follower-meta{padding:24px}#screen{margin-top:24px}#title{margin:0 0 8px;font-weight:900;font-size:24px}#viewer{margin:0}#error{color:var(--pink)}#unlock{margin:16px 24px}</style>
<main><header><div class="brand"><img src="assets/logo-mini.svg" alt="SourMusic"></div><p id="connection">Подключение…</p></header><article class="player-card"><div id="screen">Ожидание основного плеера</div><section class="follower-meta"><h1 id="title">Sourwaters Music</h1><p id="viewer"></p></section><p id="error" role="status"></p><p id="embed-hint" hidden>Если видео не запустилось, откройте «Взаимодействовать» в OBS и нажмите ▶ в видео.</p><button id="unlock" hidden>Включить воспроизведение</button></article></main>
<script src="firebase-config.js?v=11"></script><script src="sourmusic-cloud.js?v=11"></script><script>
const get=id=>document.getElementById(id);let room=null,connected=false,apiReady=false,player=null,ready=false,trackKey=null,lastSeek=0;
const roomId=new URLSearchParams(location.hash.slice(1)).get('room');
const directRequested=new URLSearchParams(location.search).get('player')==='embed';
let directTrackKey=null;
const youtubeApiUrls=['https://www.youtube.com/iframe_api','https://www.youtube.com/player_api'];
let apiScript=null,apiTimeout=null,apiAttempt=0,apiFailed=false;

function onYouTubeReady(){
  if(apiReady || apiFailed || typeof window.YT?.Player!=='function')return;
  apiReady=true;
  clearTimeout(apiTimeout);
  sync();
}

function loadYouTubeApi(){
  if(apiReady || apiScript || apiFailed)return;
  const script=document.createElement('script');
  script.src=youtubeApiUrls[apiAttempt];
  apiScript=script;
  function failed(){
    if(apiReady || apiScript!==script)return;
    clearTimeout(apiTimeout);
    script.remove();
    apiScript=null;
    if(++apiAttempt<youtubeApiUrls.length){
      loadYouTubeApi();
      return;
    }
    apiFailed=true;
    sync();
  }
  script.onerror=failed;
  script.onload=onYouTubeReady;
  apiTimeout=setTimeout(failed,10000);
  document.head.append(script);
}
window.onYouTubeIframeAPIReady=onYouTubeReady;
window.onYouTubePlayerAPIReady=onYouTubeReady;
function alive(){return connected&&room?.online&&room?.state&&room.now()-room.updatedAt<30000;}
function youtubeFrame(id,params){
  const frame=document.createElement('iframe');
  frame.title='YouTube';
  frame.allow='autoplay; encrypted-media; fullscreen';
  frame.referrerPolicy='strict-origin-when-cross-origin';
  frame.src='https://www.youtube.com/embed/'+id+'?'+new URLSearchParams(params);
  return frame;
}

function stopDirect(message){
  directTrackKey=null;
  const screen=get('screen');
  if(screen.textContent!==message)screen.textContent=message;
}

function syncDirect(state,track,key){
  if(state.playback!=='playing'){
    stopDirect('Пауза у основного стримера');
    return;
  }
  if(directTrackKey===key)return;
  const position=SourMusicCloud.targetPosition(state,room.now());
  const start=Number.isFinite(position)?Math.max(0,Math.floor(position)):0;
  const frame=youtubeFrame(track.id,{autoplay:'1',playsinline:'1',start:String(start)});
  directTrackKey=key;
  get('screen').replaceChildren(frame);
}

function sync(){
 const direct=directRequested||apiFailed;
 const hint=get('embed-hint');
 if(!alive()){
  if(ready)player.pauseVideo();
  if(direct)stopDirect('Ожидание основного плеера');
  get('connection').textContent='Ожидание основного плеера';
  hint.hidden=true;
  return;
 }
 const s=room.state,t=s.current;
 get('connection').textContent=direct?'● Подключено · Прямой плеер YouTube':'● Подключено';
 get('title').textContent=t?.title||'Очередь пуста';get('viewer').textContent=t?'Заказ от '+t.user:'';
 hint.hidden=true;
 if(!t){if(ready)player.stopVideo();else stopDirect('Очередь пуста');return;}
 if(!/^[\w-]{11}$/.test(t.id||'')){
  if(direct)stopDirect('Некорректный идентификатор трека');
  get('error').textContent='Некорректный идентификатор трека';return;
 }
 const key=t.key||t.id;
 if(t.manual){
  if(direct){stopDirect('Трек запущен вручную у основного стримера');return;}
  if(trackKey!==key+':m'){trackKey=key+':m';ready=false;if(player){player.destroy();player=null;}get('screen').textContent='Трек запущен вручную у основного стримера';get('error').textContent='';}
  return;
 }
 if(direct){syncDirect(s,t,key);hint.hidden=s.playback!=='playing';return;}
 if(!apiReady){
  if(typeof window.YT?.Player==='function'){onYouTubeReady();return;}
  get('screen').textContent='Загрузка плеера YouTube…';
  return;
 }
 if(key!==trackKey){
  trackKey=key;ready=false;lastSeek=0;if(player)player.destroy();
  const frame=youtubeFrame(t.id,{enablejsapi:'1',playsinline:'1',autoplay:'0',origin:location.origin});
  get('screen').replaceChildren(frame);get('error').textContent='';
  player=new YT.Player(frame,{events:{onReady(){ready=true;sync();},onAutoplayBlocked(){get('unlock').hidden=false;get('error').textContent='В OBS откройте «Взаимодействовать» и нажмите «Включить воспроизведение»';},onError(e){get('error').textContent='YouTube не воспроизводит этот трек ('+e.data+'). Очередью управляет основной плеер.';}}});return;
 }
 if(!ready)return;
 const target=SourMusicCloud.targetPosition(s,room.now());
 const duration=player.getDuration?.()||Infinity;const pos=Math.min(target,Math.max(0,duration-.2));
 if(Math.abs((player.getCurrentTime?.()||0)-pos)>1.25 && Date.now()-lastSeek>2500){player.seekTo(pos,true);lastSeek=Date.now();}
 const actual=player.getPlayerState?.();
 if(s.playback==='playing'){if(actual!==1&&actual!==3&&(actual!==0||pos<duration-1))player.playVideo();}
 else if(actual!==2&&actual!==5)player.pauseVideo();
}
get('unlock').onclick=()=>{player?.playVideo();get('unlock').hidden=true;get('error').textContent='';sync();};
if(!directRequested)loadYouTubeApi();
SourMusicCloud.subscribe(roomId,r=>{room=r;sync();},(ok,error)=>{connected=ok;if(error)get('error').textContent='Не удалось прочитать общую очередь: '+error;else if(ok&&get('error').textContent.startsWith('Не удалось прочитать'))get('error').textContent='';sync();}).catch(e=>{get('error').textContent=e.message;});
setInterval(sync,1000);
</script></html>
