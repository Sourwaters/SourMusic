<section class="sharing" aria-label="Совместная очередь"><label class="share-heading"><span class="switch"><input type="checkbox" id="share-toggle"><i></i></span>Подключить очередь второго стримера</label><div class="share-fields"><input id="relay-sender" aria-label="Twitch-логин отправителя заказов" placeholder="Twitch-логин" maxlength="25"><button type="button" id="copy-follower" hidden>Ссылка второго стримера ⧉</button></div><p id="share-status" role="status"></p></section>
<p id="page-address"></p><p id="role-label"></p><p id="orders"></p><p id="relay"></p>
<article class="player-card"><div class="card-cap"><span id="playback-label">Сейчас в эфире</span><span class="cut">SourMusic</span></div><div class="now"><div class="record empty" id="record" data-playing="false"><div class="vinyl"><img class="cover-art" id="cover-art" src="assets/logo.svg" alt="Обложка трека"></div><svg class="progress-ring" viewBox="0 0 160 160" aria-label="Прогресс трека" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="record-progress"><circle class="ring-track" cx="80" cy="80" r="75"/><circle class="ring-value" id="ring-value" cx="80" cy="80" r="75" pathLength="100"/></svg><button class="transport" type="button" id="stop" disabled aria-label="Воспроизвести"><svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5a1 1 0 0 1 1.5-.86l10 7a1 1 0 0 1 0 1.72l-10 7A1 1 0 0 1 8 19z"/></svg><svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg></button></div><section class="song"><p class="eyebrow">Ваш саундтрек</p><h2 id="track">Очередь пуста</h2><p id="viewer"></p></section><button type="button" id="next" class="next-button" disabled aria-label="Следующий" title="Следующий трек"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m5 5 11 7L5 19z"/><rect x="17" y="5" width="3" height="14" rx="1"/></svg></button></div><div id="screen"><span>Добавьте видео YouTube</span></div><section class="queue-section"><details open><summary id="count">В очереди (0)</summary><ol id="queue"></ol></details></section></article>

<script src="youtube-config.js?v=14"></script><script src="sourmusic-admission.js?v=14"></script><script src="sourmusic-connection.js?v=14"></script><script src="firebase-config.js?v=12"></script><script src="sourmusic-cloud.js?v=12"></script>
<script>

const ports = [8080, 8181];
const MAX_TRACK_SECONDS = 10*60;   // лимит длины для заказов зрителей
const QUEUE_KEY = 'sourmusic.queue.v1';
const rewardTitle = 'Заказ музыки SourMusic';
const videoIdPattern = /^[\w-]{11}$/;
function videoId(input) {
  const value = String(input ?? '').trim();
  if (videoIdPattern.test(value)) return value;
  try {
    const url = new URL(value);
    if (!['https:', 'http:'].includes(url.protocol)) return null;
    const [route, part] = url.pathname.split('/').filter(Boolean);
    let id;
    if (url.hostname === 'youtu.be') id = route;
    if (['youtube.com', 'www.youtube.com', 'm.youtube.com', 'music.youtube.com'].includes(url.hostname)) {
      if (route === 'watch') id = url.searchParams.get('v');
      if (['shorts', 'live', 'embed'].includes(route)) id = part;
    }
    return id && videoIdPattern.test(id) ? id : null;
  } catch {
    return null;
  }
}

const get = id => document.getElementById(id);
const status = message => { get('status').textContent = message; };
const privacyMode = new URLSearchParams(location.search).get('youtube') === 'privacy';
const youtubeHost = privacyMode ? 'www.youtube-nocookie.com' : 'www.youtube.com';
get('page-address').textContent = location.protocol === 'file:'
  ? 'Откройте плеер по HTTPS-ссылке из инструкции.'
  : 'Адрес плеера · ' + location.origin + location.pathname + ' · ' + youtubeHost;
const queue = [];
let current;
let player;
let apiReady = false;
let apiFailed = false;
let loadTimeout;
let playing = null;
let stoppedByUser=false;
const controlMode = new URLSearchParams(location.search).get('role') === 'control';
let relaySender=localStorage.getItem("sourmusic.relay.sender")??"xwaran";
let cloudPublisher=null,cloudOpening=false,cloudInfo={enabled:false,connected:false};
async function setSharing(enabled,sender=relaySender){
 relaySender=String(sender||"").trim().toLowerCase();if(!/^[a-z0-9_]{0,25}$/.test(relaySender))relaySender="";localStorage.setItem("sourmusic.relay.sender",relaySender);
 if(cloudOpening)return false;
 cloudOpening=true;
 try{
  if(enabled&&!cloudPublisher){cloudInfo={enabled:true,connected:false};renderSharing();cloudPublisher=await SourMusicCloud.publisher(info=>{const changed=JSON.stringify(cloudInfo)!==JSON.stringify(info);cloudInfo=info;renderSharing();if(changed)publishNowPlaying(false);});localStorage.setItem('sourmusic.share.enabled','1');publishCloud();}
  if(!enabled&&cloudPublisher){await cloudPublisher.close();cloudPublisher=null;localStorage.removeItem('sourmusic.share.enabled');cloudInfo={enabled:false,connected:false};}
  renderSharing();publishNowPlaying();return true;
 }catch(e){cloudInfo={enabled:false,connected:false,error:e.message};renderSharing();return false;}
 finally{cloudOpening=false;renderSharing();}
}
function renderSharing(){
 const info=controlMode?remoteState?.cloud:{...cloudInfo,sender:relaySender};
 if(document.activeElement!==get('relay-sender'))get('relay-sender').value=info?.sender||'';
 get('share-toggle').checked=!!info?.enabled;get('share-toggle').disabled=cloudOpening||(controlMode&&(!remoteState||!!commandPending));
 get('share-status').textContent=info?.error||(!info?.enabled?'':info.connected?'Общая очередь подключена':'Подключение общей очереди…');
 get('copy-follower').hidden=!info?.room;
}
function publishCloud(){
 if(!cloudPublisher)return;
 cloudPublisher.publish({current:current||null,queue,playback:playing?'playing':current?'paused':'idle',position:player?.getCurrentTime?.()||0,sampledAt:Date.now(),session:playerSession});
}
setInterval(publishCloud,5000);
const playerSession = crypto.randomUUID();
const seenCommands = new Set();
const acknowledgements = [];
let remoteState = null, commandPending = null, polling = false;
let bot, relayAction, publishing = false, publishDirty = false;
const seenOrders = new Set();
get('role-label').textContent = controlMode ? 'Док · управление источником OBS · v12' : 'Источник · воспроизведение · v12';
if(controlMode) get('screen').hidden=true;
function connectionIndicator(ready){get('connection').textContent=ready?'Подключено':'Подключение…';get('connection').setAttribute('data-ready',String(ready));}
function playbackButton(active){get('record').setAttribute('data-playing',String(active));get('stop').setAttribute('aria-label',active?'Пауза':'Воспроизвести');get('stop').title=active?'Пауза':'Воспроизвести';}

function readState(value) {
  try {
    const s = typeof value === 'string' ? JSON.parse(value) : value;
    if(!s || typeof s.session !== 'string' || !Array.isArray(s.queue) || !Number.isFinite(s.at) || Math.abs(Date.now()-s.at)>45000)return null;
    return s;
  } catch { return null; }
}
async function findRelay() {
  if(!bot?.isConnected())return;
  try {
    const result=await bot.request('GetActions');
    const matches=result.actions.filter(a=>a.name==='SourMusic State' && a.enabled);
    relayAction=matches.length===1?matches[0].id:null;
    get('relay').textContent=relayAction?'Streamer.bot: действие найдено':'Добавьте действие SourMusic State с кодом из кнопки копирования';
    if(!controlMode && relayAction)publishNowPlaying();
  } catch {get('relay').textContent='Нет связи со Streamer.bot';}
}
function snapshot() {
  return {version:12,session:playerSession,at:Date.now(),track:playing,current:current||null,queue:queue.map(q=>({id:q.id,key:q.key,title:String(q.title).slice(0,100),user:q.user})),
    position:Number(player?.getCurrentTime?.())||0,duration:Number(player?.getDuration?.())||0,sampledAt:Date.now(),playback:playing?'playing':current?'stopped':'idle',status:get('status').textContent,
    cloud:{...cloudInfo,sender:relaySender},order:get('orders').textContent,acks:acknowledgements.slice(-20)};
}
async function publishNowPlaying(includeCloud=true) {
  if(controlMode)return;
  if(includeCloud)publishCloud();
  publishDirty=true;
  if(!relayAction || !bot?.isConnected() || publishing)return;
  publishing=true;
  try {
    while(publishDirty){
      publishDirty=false;
      await bot.request('DoAction',{action:{id:relayAction},args:{sourmusicState:JSON.stringify(snapshot())}});
    }
  } catch {relayAction=null;get('relay').textContent='Передача не выполнена: проверьте SourMusic State';}
  finally {publishing=false;}
}

let artworkId='';
function updateRecord(){
 const state=controlMode?remoteState:null,t=controlMode?state?.current:current,active=controlMode?state?.playback==='playing':!!playing;
 const id=t?.id||'';
 if(artworkId!==id){artworkId=id;get('cover-art').src=id?'https://i.ytimg.com/vi/'+id+'/hqdefault.jpg':'assets/logo.svg';}
 get('record').setAttribute('data-playing',String(active));
 get('playback-label').textContent=active?'Сейчас играет':t?'На паузе':'Ждём первый трек';
 const duration=controlMode?Number(state?.duration)||0:Number(player?.getDuration?.())||0;
 let position=controlMode?Number(state?.position)||0:Number(player?.getCurrentTime?.())||0;
 if(controlMode&&active&&Number.isFinite(state?.sampledAt))position+=Math.max(0,(Date.now()-state.sampledAt)/1000);
 const pct=duration>0?Math.min(100,Math.max(0,position/duration*100)):0;
 get('ring-value').setAttribute('style','stroke-dashoffset:'+String(100-pct));get('record-progress').setAttribute('aria-valuenow',String(Math.round(pct)));
}
get('cover-art').addEventListener('error',()=>{get('cover-art').src='assets/logo.svg';},{once:true});
setInterval(updateRecord,500);

function renderRemote() {
  updateRecord();
  renderSharing();
  const s=remoteState;
  get('track').textContent=s?.current?.title||(s?'Очередь пуста':'Ожидание источника OBS');
  get('viewer').textContent=s?.current?'Заказ от '+s.current.user:'';
  get('count').textContent='В очереди ('+(s?.queue?.length||0)+')';
  get('queue').replaceChildren(...(s?.queue||[]).map(t=>{const li=document.createElement('li');li.textContent=t.title+' · '+t.user;return li;}));
  const enabled=!!s && !!relayAction && !commandPending;
  get('next').disabled=!enabled || (!s.current && !s.queue.length);
  get('stop').disabled=!enabled || !s.current;
  playbackButton(s?.playback==='playing');
  connectionIndicator(!!s && !!relayAction && bot?.isConnected());
  get('add-button').disabled=!enabled;
  get('orders').textContent=s?.order || 'Заказы принимает браузерный источник, а не док';
  get('relay').textContent=s?'Источник OBS подключён · '+(s.playback==='playing'?'играет':s.playback==='stopped'?'остановлен':'очередь пуста'):'Источник OBS не найден. Откройте ссылку источника в активной сцене.';
}
function stopTrack() {
  stoppedByUser=true;
  clearTimeout(loadTimeout);
  if(player?.pauseVideo)player.pauseVideo();
  playing=null;
  status('');
  render();
  publishNowPlaying();
}
function resumeTrack() {
  stoppedByUser=false;
  if(player?.playVideo){player.playVideo();status('Запуск…');}
  else if(current)start();
}
async function pollSync() {
  if(polling || !bot?.isConnected())return;
  polling=true;
  try {
    if(controlMode) {
      const result=await bot.request('GetGlobal',{variable:'sourmusic.nowPlaying',persisted:false});
      remoteState=readState(sourmusicGlobal(result,'sourmusic.nowPlaying'));
      if(commandPending) {
        const ack=remoteState?.acks?.find(a=>a.id===commandPending.id);
        if(ack){status(ack.ok?'':ack.message);commandPending=null;}
        else if(Date.now()-commandPending.sentAt>10000){status('Нет подтверждения команды. Обновите C# код SourMusic State и проверьте источник.');commandPending=null;}
      }
      renderRemote();
    } else {
      const result=await bot.request('GetGlobal',{variable:'sourmusic.commands',persisted:false});
      const raw=sourmusicGlobal(result,'sourmusic.commands');
      const commands=typeof raw==='string'?JSON.parse(raw):raw;
      if(!Array.isArray(commands))return;
      for(const command of commands) {
        if(command.session!==playerSession || !command.id || seenCommands.has(command.id))continue;
        seenCommands.add(command.id);
        if(seenCommands.size>256)seenCommands.delete(seenCommands.values().next().value);
        if(!Number.isFinite(command.at)||Math.abs(Date.now()-command.at)>15000)continue;
        let ok=true;
        if(command.type==='next')next();
        else if(command.type==='stop')stopTrack();
        else if(command.type==='play')resumeTrack();
        else if(command.type==='share')ok=await setSharing(!!command.enabled,command.sender);
        else if(command.type==='add')ok=await enqueue(command.url,command.user||'Sour',false,{id:command.id,login:/^[a-zA-Z0-9_]{1,25}$/.test(command.user||'')?command.user:''});
        else ok=false;
        acknowledgements.push({id:command.id,ok,message:ok?'':get('status').textContent||'Не удалось выполнить команду'});
        if(acknowledgements.length>20)acknowledgements.shift();
        publishNowPlaying();
      }
    }
  } catch {
    if(controlMode){remoteState=null;renderRemote();if(commandPending && Date.now()-commandPending.sentAt>10000){status('Нет связи с источником');commandPending=null;}}
  } finally {polling=false;}
}
async function sendCommand(type, args={}) {
  if(!remoteState || !relayAction || commandPending){status('Дождитесь подключения источника OBS');return false;}
  const id=crypto.randomUUID();
  commandPending={id,sentAt:Date.now()};renderRemote();status('Отправка команды…');
  try {
    await bot.request('DoAction',{action:{id:relayAction},args:{sourmusicCommand:JSON.stringify({id,session:remoteState.session,type,...args})}});
    return true;
  }catch{commandPending=null;status('Не удалось отправить команду');renderRemote();return false;}
}
setInterval(pollSync,1000);
setInterval(()=>{if(!relayAction)findRelay();else if(!controlMode)publishNowPlaying();},15000);
if(controlMode)renderRemote();

const titleCache=new Map();
async function resolveTitle(track){
  if(!titleCache.has(track.id))titleCache.set(track.id,(async()=>{
    const url=encodeURIComponent('https://www.youtube.com/watch?v='+track.id);
    for(const prefix of ['https://www.youtube.com/oembed?format=json&url=','https://noembed.com/embed?url=']){
      try{const response=await fetch(prefix+url,{signal:AbortSignal.timeout(7000)});if(!response.ok)continue;const data=await response.json();if(typeof data.title==='string'&&data.title.trim())return data.title.trim().slice(0,250);}catch{}
    }return null;
  })());
  const title=await titleCache.get(track.id);
  if(title)track.title=title;
  else{titleCache.delete(track.id);if(track.title==='Загрузка названия…')track.title='Название недоступно · '+track.id;}
  render();
}
function render() {
  updateRecord();
  if(controlMode){renderRemote();return;}
  saveQueue();
  get('stop').disabled=!current;
  playbackButton(!!playing);
  get('track').textContent = current?.title || 'Очередь пуста';
  get('viewer').textContent = current ? 'Заказ от ' + current.user : '';
  get('count').textContent = 'В очереди (' + queue.length + ')';
  get('next').disabled = !current && !queue.length;
  get('queue').replaceChildren(...queue.map(track => {
    const item = document.createElement('li');
    item.textContent = track.title + ' · ' + track.user;
    return item;
  }));
  publishNowPlaying();
}

function saveQueue(){
  try{localStorage.setItem(QUEUE_KEY,JSON.stringify({at:Date.now(),tracks:[current,...queue].filter(Boolean).map(t=>({id:t.id,title:t.title,user:t.user,viewer:!!t.viewer,request:t.request}))}));}catch{}
}
async function restoreQueue(){
 try{const saved=JSON.parse(localStorage.getItem(QUEUE_KEY)||'null');
 if(!saved||!Array.isArray(saved.tracks)||Date.now()-saved.at>6*3600e3)return;
 for(const t of saved.tracks.slice(0,100)){if(!videoIdPattern.test(t?.id)||typeof t.user!=='string')continue;
 await enqueue('https://youtu.be/'+t.id,t.user,!!t.viewer,t.request||null);}
 }catch{status('Не удалось восстановить очередь');}
}

const pendingNotices=new Map(),completedNotices=new Set();let sendingNotices=false,admissionTail=Promise.resolve(),pendingAdmissions=0;
function notifyOrder(request,reason){
 if(!request?.id||completedNotices.has(request.id)||pendingNotices.has(request.id))return;
 pendingNotices.set(request.id,{id:request.id,user:request.login||'',reason});
 if(pendingNotices.size>200)pendingNotices.delete(pendingNotices.keys().next().value);
 flushNotices();
}
async function flushNotices(){
 if(controlMode||sendingNotices||!relayAction||!pendingNotices.size)return;
 sendingNotices=true;
 try{for(const [id,notice] of pendingNotices){
 const r=await bot.request('DoAction',{action:{id:relayAction},args:{sourmusicNotice:JSON.stringify(notice)}});
 if(r?.status==='error')break;
 pendingNotices.delete(id);completedNotices.add(id);if(completedNotices.size>500)completedNotices.delete(completedNotices.values().next().value);
 }}catch{}finally{sendingNotices=false;}
}
setInterval(flushNotices,3000);
function rejectOrder(request,reason){status(sourmusicRejectionText[reason]||sourmusicRejectionText.playback);notifyOrder(request,reason);return false;}
function rememberOrder(id){if(seenOrders.has(id))return false;seenOrders.add(id);if(seenOrders.size>500)seenOrders.delete(seenOrders.values().next().value);return true;}
function enqueue(input,user,viewer=false,request=null){
 const order=request||{id:crypto.randomUUID(),login:/^[a-zA-Z0-9_]{1,25}$/.test(user||'')?user:''};
 if(pendingAdmissions>=100)return Promise.resolve(rejectOrder(order,'full'));
 pendingAdmissions++;
 const result=admissionTail.then(()=>admit(input,user,viewer,order));
 admissionTail=result.catch(()=>{});
 return result.finally(()=>{pendingAdmissions--;});
}
async function admit(input,user,viewer,request){
 const id=videoId(input);
 if(!id)return rejectOrder(request,'invalid');
 if(queue.length>=100)return rejectOrder(request,'full');
 if(viewer&&[current,...queue].some(t=>t?.id===id))return rejectOrder(request,'duplicate');
 status('Проверка лайков YouTube…');
 const checked=await sourmusicCheckVideo(id);
 if(!checked.ok)return rejectOrder(request,checked.reason);
 const track={id,key:crypto.randomUUID(),title:checked.title||'Название недоступно · '+id,user:String(user||'Зритель').slice(0,80),viewer,request,likes:checked.likes};
 queue.push(track);status('');if(!current)next();else render();return true;
}

function next() {
  stoppedByUser=false;
  get('manual').hidden = true;
  playing = null;
  clearTimeout(loadTimeout);
  const oldPlayer = player;
  player = null;
  if (oldPlayer) oldPlayer.destroy();
  current = queue.shift();
  get('screen').textContent = 'Добавьте видео YouTube';
  render();
  if (!current) {
    status('');
    return;
  }
  start();
}

function start() {
  if (!apiReady) {
    const waiting=current;clearTimeout(loadTimeout);
    loadTimeout=setTimeout(()=>{if(current===waiting&&!apiReady&&!stoppedByUser)notifyOrder(waiting?.request,'playback');},15000);
    status(apiFailed ? 'Не удалось загрузить YouTube. Проверьте интернет и обновите страницу.'
      : 'Загрузка YouTube…');
    return;
  }
  clearTimeout(loadTimeout);
  const track = current;
  const frame = document.createElement('iframe');
  const params = new URLSearchParams({ enablejsapi: '1', playsinline: '1', autoplay: '1' });
  if (location.protocol !== 'file:') params.set('origin', location.origin);
  frame.src = 'https://' + youtubeHost + '/embed/' + track.id + '?' + params;
  frame.title = 'Плеер YouTube';
  frame.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
  frame.allowFullscreen = true;
  frame.referrerPolicy = 'strict-origin-when-cross-origin';
  get('screen').replaceChildren(frame);
  status('Загрузка видео…');
  loadTimeout = setTimeout(() => {
    if(current!==track||playing===track||stoppedByUser)return;
    notifyOrder(track.request,'playback');status('Видео не загрузилось. Попробуйте нажать ▶ или выберите «Следующий».');
  }, 12000);
  player = new YT.Player(frame, {
    events: {
      onReady(event) {
        if (current !== track) return;
        event.target.playVideo();
      },
      onStateChange(event) {
        if (current !== track) return;
        if (event.data === YT.PlayerState.ENDED) { if(!stoppedByUser)next(); return; }
        if (event.data === YT.PlayerState.PLAYING) {
          clearTimeout(loadTimeout);
          const duration = event.target.getDuration?.() || 0;
          if (track.viewer && duration > MAX_TRACK_SECONDS) { notifyOrder(track.request,'duration');status('Трек длиннее ' + MAX_TRACK_SECONDS/60 + ' минут — пропущен.'); next(); return; }
          const title = event.target.getVideoData?.()?.title;
          if (title) track.title = title;
          playing = track;
          publishNowPlaying();
          status('');
          render();
        } else if (event.data === YT.PlayerState.PAUSED && playing === track) {
          playing = null;
          render();
          publishNowPlaying();
        }
      },
      onAutoplayBlocked() {
        if (current !== track) return;
        clearTimeout(loadTimeout);
        status('Автозапуск заблокирован. Нажмите ▶ в плеере.');
      },
      onError(event) {
        if (current !== track) return;
        notifyOrder(track.request,event.data===153?'configuration':[101,150].includes(event.data)?'embed':event.data===100?'unavailable':'playback');
        clearTimeout(loadTimeout);
        playing = null;
        publishNowPlaying();
        if (event.data !== 153) setTimeout(() => { if (current === track && !playing) next(); }, [2, 5, 100].includes(event.data) ? 3000 : 30000);
        if ([101, 150].includes(event.data)) {
          get('watch').href = 'https://www.youtube.com/watch?v=' + track.id;
          get('manual-title').value = event.target?.getVideoData?.()?.title || '';
          get('manual-start').disabled = false;
          get('manual').hidden = false;
          status('YouTube ' + event.data + ' · запустите видео на YouTube или нажмите «Следующий».');
          return;
        }
        if (event.data === 153) {
          status(location.protocol === 'file:'
            ? 'YouTube 153 · откройте плеер по HTTPS-ссылке из инструкции.'
            : 'YouTube 153 · откройте этот же адрес в Edge или Chrome для проверки.');
          return;
        }
        status('YouTube не воспроизводит это видео (' + event.data + '). Нажмите «Следующий».');
      }
    }
  });
}

  events:controlMode?null:undefined,
  onStatus:text=>{connectionIndicator(!controlMode && text.startsWith('Streamer.bot подключён'));if(controlMode&&!text.startsWith('Streamer.bot подключён')){remoteState=null;renderRemote();}},
  onReady:()=>{findRelay();pollSync();},
  onEvent:async ({event,data})=>{
    if(controlMode)return;
    if(String(event.source).toLowerCase()==='twitch'&&String(event.type).toLowerCase()==='chatmessage'){
      const login=String(data?.user?.login||data?.user?.name||data?.user_login||data?.userName||data?.message?.username||'').toLowerCase();
      if(!cloudInfo.enabled||!relaySender||login!==relaySender)return;
      const text=typeof data?.message==='string'?data.message:(data?.message?.text||data?.message?.message||data?.text||'');
      const parts=text.trim().split(/\s+/);
      if(parts.length!==4||parts[0].toLowerCase()!=='!addsourmusic'||!/^\w{1,25}$/.test(parts[2])||! /^[a-zA-Z0-9-]{8,80}$/.test(parts[3]))return;
      const key='relay:'+login+':'+parts[3];if(!rememberOrder(key))return;
      await enqueue(parts[1],parts[2],true,{id:key,login:parts[2]});
      return;
    }
    if(String(event.source).toLowerCase()!=='twitch'||String(event.type).toLowerCase()!=='rewardredemption')return;
    const name=String(data?.reward?.title ?? data?.rewardName ?? data?.rewardTitle ?? '').trim();
    const input=String(data?.user_input ?? data?.userInput ?? data?.rawInput ?? '').trim();
    const normal=s=>s.normalize('NFKC').replace(/\s+/g,' ').trim().toLowerCase();
    const note=message=>{get('orders').textContent='Заказы · v12 · '+new Date().toLocaleTimeString()+': '+message;publishNowPlaying();};
    if(normal(name)!==normal(rewardTitle)){note('Получена награда «'+name+'», ожидается «'+rewardTitle+'».');return;}
    const redemptionId=String(data.redemptionId??data.id??crypto.randomUUID());
    if(!rememberOrder(redemptionId))return;
    const login=data.user_login||data.user?.login||data.userName||'';
    const user=data.user?.displayName||data.user?.name||data.user_name||login||'Зритель';
    const ok=await enqueue(input,user,true,{id:redemptionId,login});
    note(ok?'Добавлен трек '+videoId(input)+' · '+user:get('status').textContent);

  }
});

const codeForStreamerBot="using System;\nusing Newtonsoft.Json;\nusing Newtonsoft.Json.Linq;\n\npublic class CPHInline\n{\n    private static readonly object Gate = new object();\n    private static readonly System.Collections.Generic.Queue<string> Notices = new System.Collections.Generic.Queue<string>();\n    public bool Execute()\n    {\n        lock (Gate)\n        {\n            try\n            {\n                string value;\n                long now = DateTimeOffset.UtcNow.ToUnixTimeMilliseconds();\n                if (CPH.TryGetArg<string>(\"sourmusicNotice\", out value))\n                {\n                    if (String.IsNullOrEmpty(value) || value.Length > 2048) return false;\n                    JObject notice = JObject.Parse(value);\n                    string id = (string)notice[\"id\"], user = (string)notice[\"user\"], reason = (string)notice[\"reason\"];\n                    if (String.IsNullOrEmpty(id) || id.Length > 200 || (!String.IsNullOrEmpty(user) && !System.Text.RegularExpressions.Regex.IsMatch(user, @\"^[a-zA-Z0-9_]{1,25}$\"))) return false;\n                    string message;\n                    switch (reason)\n                    {\n                        case \"likes\": message = \"отказано: у видео меньше 1000 лайков. Выбери другой трек.\"; break;\n                        case \"likesUnknown\": message = \"отказано: YouTube не предоставил число лайков. Выбери другое видео.\"; break;\n                        case \"check\": message = \"отказано: не удалось проверить лайки YouTube. Попробуй позже.\"; break;\n                        case \"duplicate\": message = \"отказано: этот трек уже в очереди.\"; break;\n                        case \"duration\": message = \"отказано: трек превышает допустимую длительность.\"; break;\n                        case \"invalid\": message = \"заказ музыки не принят: нужна ссылка на одно видео YouTube (https://youtu.be/… или https://www.youtube.com/watch?v=…).\"; break;\n                        case \"unavailable\": message = \"YouTube не разрешил воспроизвести заказанный трек: видео удалено, закрыто или недоступно. Выбери другое видео и обратись к модератору по поводу баллов.\"; break;\n                        case \"embed\": message = \"YouTube запретил воспроизведение заказанного трека во встроенном плеере. Выбери другое видео и обратись к модератору по поводу баллов.\"; break;\n                        case \"playback\": message = \"не удалось запустить заказанный трек из-за ошибки воспроизведения YouTube. Стримеру нужно проверить плеер.\"; break;\n                        case \"configuration\": message = \"заказанный трек не запустился из-за ошибки настройки YouTube-плеера. Стримеру нужно проверить источник OBS.\"; break;\n                        case \"full\": message = \"заказ музыки не принят: общая очередь заполнена. Обратись к модератору по поводу баллов.\"; break;\n                        default: return false;\n                    }\n                    if (Notices.Contains(id)) return true;\n                    CPH.SendMessage((String.IsNullOrEmpty(user) ? \"SourMusic: \" : \"@\" + user + \", \") + message, false);\n                    Notices.Enqueue(id);\n                    while (Notices.Count > 500) Notices.Dequeue();\n                    return true;\n                }\n                if (CPH.TryGetArg<string>(\"sourmusicCommand\", out value))\n                {\n                    if (String.IsNullOrEmpty(value) || value.Length > 4096) return false;\n                    JObject command = JObject.Parse(value);\n                    string type = (string)command[\"type\"];\n                    if (type != \"next\" && type != \"stop\" && type != \"play\" && type != \"add\" && type != \"share\") return false;\n                    if (String.IsNullOrEmpty((string)command[\"id\"]) || String.IsNullOrEmpty((string)command[\"session\"])) return false;\n                    if (type == \"add\")\n                    {\n                        string url = (string)command[\"url\"];\n                        string viewer = (string)command[\"user\"];\n                        if (String.IsNullOrEmpty(url) || url.Length > 300 || (viewer != null && viewer.Length > 80)) return false;\n                    }\n                    command[\"at\"] = now;\n                    string saved = CPH.GetGlobalVar<string>(\"sourmusic.commands\", false);\n                    JArray commands;\n                    try { commands = String.IsNullOrEmpty(saved) ? new JArray() : JArray.Parse(saved); }\n                    catch (Exception parseError)\n                    {\n                        CPH.LogError(\"SourMusic: очередь команд повреждена и сброшена: \" + parseError.Message);\n                        commands = new JArray();\n                    }\n                    foreach (JToken item in commands) if ((string)item[\"id\"] == (string)command[\"id\"]) return true;\n                    commands.Add(command);\n                    while (commands.Count > 64) commands.RemoveAt(0);\n                    CPH.SetGlobalVar(\"sourmusic.commands\", commands.ToString(Formatting.None), false);\n                    return true;\n                }\n                if (!CPH.TryGetArg<string>(\"sourmusicState\", out value) || String.IsNullOrEmpty(value) || value.Length > 65536) return false;\n                JObject state = JObject.Parse(value);\n                state[\"at\"] = now;\n                CPH.SetGlobalVar(\"sourmusic.nowPlaying\", state.ToString(Formatting.None), false);\n                // Лёгкая копия для оверлея: только текущий трек.\n                JObject small = new JObject();\n                small[\"at\"] = now;\n                JToken track = state[\"track\"];\n                small[\"track\"] = track == null ? JValue.CreateNull() : track.DeepClone();\n                CPH.SetGlobalVar(\"sourmusic.track\", small.ToString(Formatting.None), false);\n                return true;\n            }\n            catch (Exception error)\n            {\n                CPH.LogError(\"SourMusic State: \" + error.Message);\n                return false;\n            }\n        }\n    }\n}\n";
