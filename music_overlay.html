<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SourMusic — оверлей</title><link rel="stylesheet" href="brand.css?v=12"><style>
body{background:transparent;overflow:hidden}.overlay-card{position:relative;width:min(550px,100vw);height:160px;display:flex;align-items:center;gap:16px;padding:5px 28px 5px 5px;color:var(--ink);isolation:isolate}.overlay-card:before{content:'';position:absolute;inset:5px 0 5px 75px;z-index:-1;border:3px solid var(--ink);border-radius:0 100px 100px 0;background:var(--gradient)}.overlay-card .record{width:150px;height:150px}.overlay-card .song h2{font-size:22px;margin:6px 0 8px;line-height:1.15;font-weight:900;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.overlay-card .song p{color:var(--ink);font-size:12px;font-weight:800}.overlay-card .song .eyebrow{font-size:9px;letter-spacing:.12em}.overlay-card .transport{width:36px;height:36px;padding:6px}.overlay-card .vinyl{box-shadow:0 0 0 8px #09070d}.overlay-card .ring-track{stroke:#ffffff17}.overlay-card .song{padding-right:4px}@media(max-width:420px){.overlay-card{gap:12px;padding-right:20px}.overlay-card .record{width:130px;height:130px}.overlay-card .song h2{font-size:18px}.overlay-card:before{inset:15px 0 15px 65px}}
.overlay-card{width:min(360px,100vw);height:150px;padding:0 22px 0 0;gap:8px}.overlay-card:before{inset:0 0 0 75px;border-color:#000}.overlay-card .record{width:150px;height:150px}.overlay-card .vinyl{box-shadow:none}.overlay-card .song h2{font-size:18px;line-height:1.2;margin:0 0 14px;text-transform:uppercase;-webkit-line-clamp:3}.overlay-card .song p{font-size:9px;color:#000}.overlay-card .song .eyebrow{display:none}.overlay-card .ring-track{stroke:transparent}</style><article class="overlay-card" id="card" hidden><div class="record empty" id="record" data-playing="false"><div class="vinyl"><img class="cover-art" id="cover-art" src="assets/logo.svg" alt="Обложка трека"></div><svg class="progress-ring" viewBox="0 0 160 160" aria-label="Прогресс трека" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="record-progress"><circle class="ring-track" cx="80" cy="80" r="75"/><circle class="ring-value" id="ring-value" cx="80" cy="80" r="75" pathLength="100"/></svg><span class="transport" aria-hidden="true"><svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5a1 1 0 0 1 1.5-.86l10 7a1 1 0 0 1 0 1.72l-10 7A1 1 0 0 1 8 19z"/></svg><svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg></span></div><section class="song"><p class="eyebrow" id="label">Сейчас играет</p><h2 id="track"></h2><p id="viewer"></p></section></article><script src="sourmusic-connection.js?v=12"></script><script>
const get=id=>document.getElementById(id);let state=null,previousId='',bot,polling=false;
function display(){const fresh=state&&Number.isFinite(state.at)&&Math.abs(Date.now()-state.at)<45000;const t=fresh?(state.current||state.track):null;get('card').hidden=!t;if(!t)return;const playing=state.playback==='playing'||(!state.playback&&!!state.track);get('track').textContent=t.title;get('viewer').textContent='Заказ от '+t.user;get('label').textContent=playing?'Сейчас играет':'На паузе';get('record').setAttribute('data-playing',String(playing));if(previousId!==t.id){previousId=t.id;get('cover-art').src=/^[a-zA-Z0-9_-]{11}$/.test(t.id||'')?'https://i.ytimg.com/vi/'+t.id+'/hqdefault.jpg':'assets/logo.svg';}const duration=Number(state.duration)||0;let pos=Number(state.position)||0;if(playing&&Number.isFinite(state.sampledAt))pos+=Math.max(0,(Date.now()-state.sampledAt)/1000);const pct=duration>0?Math.min(100,Math.max(0,pos/duration*100)):0;get('ring-value').setAttribute('style','stroke-dashoffset:'+(100-pct));get('record-progress').setAttribute('aria-valuenow',String(Math.round(pct)));}
async function refresh(){if(polling)return;polling=true;try{const r=await bot.request('GetGlobal',{variable:'sourmusic.nowPlaying',persisted:false});const raw=sourmusicGlobal(r,'sourmusic.nowPlaying');state=typeof raw==='string'?JSON.parse(raw):raw;display();}catch{state=null;display();}finally{polling=false;}}
get('cover-art').addEventListener('error',()=>{get('cover-art').src='assets/logo.svg';},{once:true});
if(new URLSearchParams(location.search).get('demo')==='1'){state={at:Date.now(),sampledAt:Date.now(),position:70,duration:210,playback:'playing',current:{id:'',title:'Espresso — Sabrina Carpenter',user:'Sourwaters'}};setInterval(()=>{state.at=Date.now();},1000);display();}else{bot=sourmusicConnect({onReady:refresh,onStatus:text=>{if(!text.startsWith('Streamer.bot подключён')){state=null;display();}}});setInterval(refresh,1000);}setInterval(display,500);
</script></html>
