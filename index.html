<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Sourwaters Music</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: #151020; color: #faf6ff; font: 15px system-ui, sans-serif; }
  main { max-width: 760px; margin: auto; }
  header, form { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  [hidden] { display: none !important; }
  #manual a { color: #d5b9ff; }
  header { justify-content: space-between; margin-bottom: 10px; }
  h1 { font-size: 23px; margin: 0; }
  #connection { color: #d5b9ff; }
  #screen { background: #09060e; display: grid; place-items: center; height: clamp(200px, 48vh, 380px);
    border: 1px solid #60468b; border-radius: 12px; overflow: hidden; }
  #screen iframe { display: block; border: 0; width: 100%; height: 100%; }
  #track { margin: 10px 0 2px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #viewer, #status { color: #e0d1ee; margin: 4px 0; }
  #status { min-height: 20px; }
  input, button { padding: 8px 10px; border: 1px solid #a171f8; border-radius: 7px; font: inherit; }
  input { background: #251937; color: white; min-width: 110px; }
  input[name="video"] { flex: 2; }
  input[name="viewer"] { flex: 1; }
  button { cursor: pointer; background: #a171f8; color: #150b23; font-weight: 700; }
  button:disabled { opacity: .55; cursor: default; }
  ol { margin: 5px 0 0; padding-left: 24px; max-height: 95px; overflow: auto; }
  details { margin-top: 8px; }
#page-address,#role-label,#orders,#relay {display:none}
#connection {font-size:13px;display:flex;align-items:center;gap:7px}
#connection::before {content:'';width:8px;height:8px;border-radius:50%;background:#e1ae58}
#connection[data-ready="true"]::before {background:#6ee7a2}
#status:empty {display:none} #status {min-height:0}
#viewer {margin-bottom:16px}
.copy-actions {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:20px}
.copy-actions button {display:flex;justify-content:space-between;align-items:center;gap:8px;background:#251937;color:#e0d1ee;text-align:left;font-size:13px}
.copy-actions svg {flex-shrink:0}
#stop {min-width:42px;font-size:18px;line-height:20px}
</style>
<main>
  <header><h1>Sourwaters Music</h1><span id="connection" role="status"></span></header>
  <section style="margin:12px 0"><label><input type="checkbox" id="share-toggle"> Подключить очередь второго стримера</label><p><input id="relay-sender" aria-label="Twitch-логин отправителя заказов" placeholder="Twitch-логин отправителя заказов" maxlength="25"></p><p id="share-status" role="status"></p><button type="button" id="copy-follower" hidden>Скопировать ссылку для второго стримера ⧉</button></section><p id="page-address" style="margin: 0 0 8px; color: #d5b9ff; overflow-wrap: anywhere"></p>
  <p id="role-label" style="color:#d5b9ff"></p><p id="orders" style="color:#d5b9ff">Заказы · v11: после открытия страницы покупок ещё не получено</p>
  <p id="relay" style="color:#d5b9ff">Оверлей: подключение…</p>
  <div id="screen"><span>Добавьте видео YouTube</span></div>
  <h2 id="track">Очередь пуста</h2>
  <p id="viewer"></p>
  <p id="status" role="status"></p>
  <form id="manual" hidden>
    <a id="watch" target="_blank" rel="noopener noreferrer">Открыть на YouTube</a>
    <input id="manual-title" aria-label="Название трека для оверлея" placeholder="Название трека" maxlength="200" required>
    <button id="manual-start">Уже играет · показать в оверлее</button>
  </form>
  <form id="add">
    <input name="video" aria-label="Ссылка YouTube" placeholder="Ссылка YouTube" required>
    <input name="viewer" aria-label="Ник заказавшего" placeholder="Ник заказавшего" maxlength="60">
    <button id="add-button">Добавить</button>
    <button type="button" id="next" disabled>Следующий</button><button type="button" id="stop" disabled aria-label="Воспроизвести">▶</button>
  </form>
  <details open><summary id="count">В очереди (0)</summary><ol id="queue"></ol></details>
<div class="copy-actions"><button type="button" id="copy-source" aria-label="Скопировать: Источник OBS">Источник OBS<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V4H3v13h5"/></svg></button><button type="button" id="copy-dock" aria-label="Скопировать: Док управления">Док управления<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V4H3v13h5"/></svg></button><button type="button" id="copy-overlay" aria-label="Скопировать: Оверлей">Оверлей<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V4H3v13h5"/></svg></button><button type="button" id="copy-code" aria-label="Скопировать: Код для Streamer.bot">Код для Streamer.bot<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V4H3v13h5"/></svg></button></div><p id="copy-result" role="status"></p><textarea id="copy-fallback" aria-label="Для ручного копирования" readonly hidden style="width:100%;height:100px"></textarea></main>
<script src="sourmusic-connection.js?v=11"></script><script src="firebase-config.js?v=11"></script><script src="sourmusic-cloud.js?v=11"></script>
<script>

const ports = [8080, 8181];
const MAX_TRACK_SECONDS = 10*60;   // лимит длины для заказов зрителей
const QUEUE_KEY = 'sourmusic.queue.v1';
const rewardTitle = 'Заказ музыки SourMusic';
const videoIdPattern = /^[\w-]{11}$/;
function videoId(input) {
  const value = String(input ?? '').trim();
  if (videoIdPattern.test(value)) return value;
  try {
    const url = new URL(value);
    if (!['https:', 'http:'].includes(url.protocol)) return null;
    const [route, part] = url.pathname.split('/').filter(Boolean);
    let id;
    if (url.hostname === 'youtu.be') id = route;
    if (['youtube.com', 'www.youtube.com', 'm.youtube.com', 'music.youtube.com'].includes(url.hostname)) {
      if (route === 'watch') id = url.searchParams.get('v');
      if (['shorts', 'live', 'embed'].includes(route)) id = part;
    }
    return id && videoIdPattern.test(id) ? id : null;
  } catch {
    return null;
  }
}

const get = id => document.getElementById(id);
const status = message => { get('status').textContent = message; };
const privacyMode = new URLSearchParams(location.search).get('youtube') === 'privacy';
const youtubeHost = privacyMode ? 'www.youtube-nocookie.com' : 'www.youtube.com';
get('page-address').textContent = location.protocol === 'file:'
  ? 'Откройте плеер по HTTPS-ссылке из инструкции.'
  : 'Адрес плеера · ' + location.origin + location.pathname + ' · ' + youtubeHost;
const queue = [];
let current;
let player;
let apiReady = false;
let apiFailed = false;
let loadTimeout;
let playing = null;
let stoppedByUser=false;
const controlMode = new URLSearchParams(location.search).get('role') === 'control';
let relaySender=localStorage.getItem("sourmusic.relay.sender")??"xwaran";
let cloudPublisher=null,cloudOpening=false,cloudInfo={enabled:false,connected:false};
async function setSharing(enabled,sender=relaySender){
 relaySender=String(sender||"").trim().toLowerCase();if(!/^[a-z0-9_]{0,25}$/.test(relaySender))relaySender="";localStorage.setItem("sourmusic.relay.sender",relaySender);
 if(cloudOpening)return false;
 cloudOpening=true;
 try{
  if(enabled&&!cloudPublisher){cloudInfo={enabled:true,connected:false};renderSharing();cloudPublisher=await SourMusicCloud.publisher(info=>{const changed=JSON.stringify(cloudInfo)!==JSON.stringify(info);cloudInfo=info;renderSharing();if(changed)publishNowPlaying(false);});localStorage.setItem('sourmusic.share.enabled','1');publishCloud();}
  if(!enabled&&cloudPublisher){await cloudPublisher.close();cloudPublisher=null;localStorage.removeItem('sourmusic.share.enabled');cloudInfo={enabled:false,connected:false};}
  renderSharing();publishNowPlaying();return true;
 }catch(e){cloudInfo={enabled:false,connected:false,error:e.message};renderSharing();return false;}
 finally{cloudOpening=false;renderSharing();}
}
function renderSharing(){
 const info=controlMode?remoteState?.cloud:{...cloudInfo,sender:relaySender};
 if(document.activeElement!==get('relay-sender'))get('relay-sender').value=info?.sender||'';
 get('share-toggle').checked=!!info?.enabled;get('share-toggle').disabled=cloudOpening||(controlMode&&(!remoteState||!!commandPending));
 get('share-status').textContent=info?.error||(!info?.enabled?'':info.connected?'Общая очередь подключена':'Подключение общей очереди…');
 get('copy-follower').hidden=!info?.room;
}
function publishCloud(){
 if(!cloudPublisher)return;
 cloudPublisher.publish({current:current||null,queue,playback:playing?'playing':current?'paused':'idle',position:player?.getCurrentTime?.()||0,sampledAt:Date.now(),session:playerSession});
}
setInterval(publishCloud,5000);
const playerSession = crypto.randomUUID();
const seenCommands = new Set();
const acknowledgements = [];
let remoteState = null, commandPending = null, polling = false;
let bot, relayAction, publishing = false, publishDirty = false;
const seenOrders = new Set();
get('role-label').textContent = controlMode ? 'Док · управление источником OBS · v11' : 'Источник · воспроизведение · v11';
if(controlMode) get('screen').hidden=true;
function connectionIndicator(ready){get('connection').textContent=ready?'Подключено':'Подключение…';get('connection').setAttribute('data-ready',String(ready));}
function playbackButton(active){get('stop').textContent=active?'❚❚':'▶';get('stop').setAttribute('aria-label',active?'Пауза':'Воспроизвести');get('stop').title=active?'Пауза':'Воспроизвести';}

function readState(value) {
  try {
    const s = typeof value === 'string' ? JSON.parse(value) : value;
    if(!s || typeof s.session !== 'string' || !Array.isArray(s.queue) || !Number.isFinite(s.at) || Math.abs(Date.now()-s.at)>45000)return null;
    return s;
  } catch { return null; }
}
async function findRelay() {
  if(!bot?.isConnected())return;
  try {
    const result=await bot.request('GetActions');
    const matches=result.actions.filter(a=>a.name==='SourMusic State' && a.enabled);
    relayAction=matches.length===1?matches[0].id:null;
    get('relay').textContent=relayAction?'Streamer.bot: действие найдено':'Добавьте действие SourMusic State с кодом из кнопки копирования';
    if(!controlMode && relayAction)publishNowPlaying();
  } catch {get('relay').textContent='Нет связи со Streamer.bot';}
}
function snapshot() {
  return {version:11,session:playerSession,at:Date.now(),track:playing,current:current||null,queue:queue.map(q=>({id:q.id,key:q.key,title:String(q.title).slice(0,100),user:q.user})),
    playback:playing?'playing':current?'stopped':'idle',status:get('status').textContent,
    cloud:{...cloudInfo,sender:relaySender},order:get('orders').textContent,acks:acknowledgements.slice(-20)};
}
async function publishNowPlaying(includeCloud=true) {
  if(controlMode)return;
  if(includeCloud)publishCloud();
  publishDirty=true;
  if(!relayAction || !bot?.isConnected() || publishing)return;
  publishing=true;
  try {
    while(publishDirty){
      publishDirty=false;
      await bot.request('DoAction',{action:{id:relayAction},args:{sourmusicState:JSON.stringify(snapshot())}});
    }
  } catch {relayAction=null;get('relay').textContent='Передача не выполнена: проверьте SourMusic State';}
  finally {publishing=false;}
}
function renderRemote() {
  renderSharing();
  const s=remoteState;
  get('track').textContent=s?.current?.title||(s?'Очередь пуста':'Ожидание источника OBS');
  get('viewer').textContent=s?.current?'Заказ от '+s.current.user:'';
  get('count').textContent='В очереди ('+(s?.queue?.length||0)+')';
  get('queue').replaceChildren(...(s?.queue||[]).map(t=>{const li=document.createElement('li');li.textContent=t.title+' · '+t.user;return li;}));
  const enabled=!!s && !!relayAction && !commandPending;
  get('next').disabled=!enabled || (!s.current && !s.queue.length);
  get('stop').disabled=!enabled || !s.current;
  playbackButton(s?.playback==='playing');
  connectionIndicator(!!s && !!relayAction && bot?.isConnected());
  get('add-button').disabled=!enabled;
  get('orders').textContent=s?.order || 'Заказы принимает браузерный источник, а не док';
  get('relay').textContent=s?'Источник OBS подключён · '+(s.playback==='playing'?'играет':s.playback==='stopped'?'остановлен':'очередь пуста'):'Источник OBS не найден. Откройте ссылку источника в активной сцене.';
}
function stopTrack() {
  stoppedByUser=true;
  clearTimeout(loadTimeout);
  if(player?.pauseVideo)player.pauseVideo();
  playing=null;
  status('');
  render();
  publishNowPlaying();
}
function resumeTrack() {
  stoppedByUser=false;
  if(player?.playVideo){player.playVideo();status('Запуск…');}
  else if(current)start();
}
async function pollSync() {
  if(polling || !bot?.isConnected())return;
  polling=true;
  try {
    if(controlMode) {
      const result=await bot.request('GetGlobal',{variable:'sourmusic.nowPlaying',persisted:false});
      remoteState=readState(sourmusicGlobal(result,'sourmusic.nowPlaying'));
      if(commandPending) {
        const ack=remoteState?.acks?.find(a=>a.id===commandPending.id);
        if(ack){status(ack.ok?'':ack.message);commandPending=null;}
        else if(Date.now()-commandPending.sentAt>10000){status('Нет подтверждения команды. Обновите C# код SourMusic State и проверьте источник.');commandPending=null;}
      }
      renderRemote();
    } else {
      const result=await bot.request('GetGlobal',{variable:'sourmusic.commands',persisted:false});
      const raw=sourmusicGlobal(result,'sourmusic.commands');
      const commands=typeof raw==='string'?JSON.parse(raw):raw;
      if(!Array.isArray(commands))return;
      for(const command of commands) {
        if(command.session!==playerSession || !command.id || seenCommands.has(command.id))continue;
        seenCommands.add(command.id);
        if(seenCommands.size>256)seenCommands.delete(seenCommands.values().next().value);
        if(!Number.isFinite(command.at)||Math.abs(Date.now()-command.at)>15000)continue;
        let ok=true;
        if(command.type==='next')next();
        else if(command.type==='stop')stopTrack();
        else if(command.type==='play')resumeTrack();
        else if(command.type==='share')ok=await setSharing(!!command.enabled,command.sender);
        else if(command.type==='add')ok=enqueue(command.url,command.user||'Sour');
        else ok=false;
        acknowledgements.push({id:command.id,ok,message:ok?'':'Не удалось выполнить команду'});
        if(acknowledgements.length>20)acknowledgements.shift();
        publishNowPlaying();
      }
    }
  } catch {
    if(controlMode){remoteState=null;renderRemote();if(commandPending && Date.now()-commandPending.sentAt>10000){status('Нет связи с источником');commandPending=null;}}
  } finally {polling=false;}
}
async function sendCommand(type, args={}) {
  if(!remoteState || !relayAction || commandPending){status('Дождитесь подключения источника OBS');return false;}
  const id=crypto.randomUUID();
  commandPending={id,sentAt:Date.now()};renderRemote();status('Отправка команды…');
  try {
    await bot.request('DoAction',{action:{id:relayAction},args:{sourmusicCommand:JSON.stringify({id,session:remoteState.session,type,...args})}});
    return true;
  }catch{commandPending=null;status('Не удалось отправить команду');renderRemote();return false;}
}
setInterval(pollSync,1000);
setInterval(()=>{if(!relayAction)findRelay();else if(!controlMode)publishNowPlaying();},15000);
if(controlMode)renderRemote();

const titleCache=new Map();
async function resolveTitle(track){
  if(!titleCache.has(track.id))titleCache.set(track.id,(async()=>{
    const url=encodeURIComponent('https://www.youtube.com/watch?v='+track.id);
    for(const prefix of ['https://www.youtube.com/oembed?format=json&url=','https://noembed.com/embed?url=']){
      try{const response=await fetch(prefix+url,{signal:AbortSignal.timeout(7000)});if(!response.ok)continue;const data=await response.json();if(typeof data.title==='string'&&data.title.trim())return data.title.trim().slice(0,250);}catch{}
    }return null;
  })());
  const title=await titleCache.get(track.id);
  if(title)track.title=title;
  else{titleCache.delete(track.id);if(track.title==='Загрузка названия…')track.title='Название недоступно · '+track.id;}
  render();
}
function render() {
  if(controlMode){renderRemote();return;}
  saveQueue();
  get('stop').disabled=!current;
  playbackButton(!!playing);
  get('track').textContent = current?.title || 'Очередь пуста';
  get('viewer').textContent = current ? 'Заказ от ' + current.user : '';
  get('count').textContent = 'В очереди (' + queue.length + ')';
  get('next').disabled = !current && !queue.length;
  get('queue').replaceChildren(...queue.map(track => {
    const item = document.createElement('li');
    item.textContent = track.title + ' · ' + track.user;
    return item;
  }));
  publishNowPlaying();
}

function saveQueue(){
  try{localStorage.setItem(QUEUE_KEY,JSON.stringify({at:Date.now(),tracks:[current,...queue].filter(Boolean).map(t=>({id:t.id,title:t.title,user:t.user,viewer:!!t.viewer}))}));}catch{}
}
function restoreQueue(){
  try{
    const saved=JSON.parse(localStorage.getItem(QUEUE_KEY)||'null');
    if(!saved||!Array.isArray(saved.tracks)||Date.now()-saved.at>6*3600e3)return;
    for(const t of saved.tracks.slice(0,100)){
      if(!videoIdPattern.test(t?.id)||typeof t.user!=='string')continue;
      const track={id:t.id,key:crypto.randomUUID(),title:String(t.title||'').slice(0,250)||'Загрузка названия…',user:t.user.slice(0,80),viewer:!!t.viewer};
      queue.push(track);
      if(!t.title||t.title==='Загрузка названия…'||t.title.startsWith('Название недоступно'))resolveTitle(track);
    }
    if(queue.length){status('Очередь восстановлена · '+queue.length);next();}
  }catch{}
}

function enqueue(input, user, viewer=false) {
  const id = videoId(input);
  if (!id) {
    status('Введите ссылку на отдельное видео YouTube.');
    return false;
  }
  if(queue.length>=100){status('В очереди уже 100 треков');return false;}
  const name = String(user||'Зритель').slice(0,80);
  if (viewer) {
    const all = [current, ...queue].filter(Boolean);
    if (all.some(t => t.id === id)) { status('Этот трек уже в очереди.'); return false; }
  }
  const track = { id, key:crypto.randomUUID(), title: 'Загрузка названия…', user:name, viewer };
  queue.push(track);
  resolveTitle(track);
  if (!current) next();
  else render();
  return true;
}

function next() {
  stoppedByUser=false;
  get('manual').hidden = true;
  playing = null;
  clearTimeout(loadTimeout);
  const oldPlayer = player;
  player = null;
  if (oldPlayer) oldPlayer.destroy();
  current = queue.shift();
  get('screen').textContent = 'Добавьте видео YouTube';
  render();
  if (!current) {
    status('');
    return;
  }
  start();
}

function start() {
  if (!apiReady) {
    status(apiFailed ? 'Не удалось загрузить YouTube. Проверьте интернет и обновите страницу.'
      : 'Загрузка YouTube…');
    return;
  }
  const track = current;
  const frame = document.createElement('iframe');
  const params = new URLSearchParams({ enablejsapi: '1', playsinline: '1', autoplay: '1' });
  if (location.protocol !== 'file:') params.set('origin', location.origin);
  frame.src = 'https://' + youtubeHost + '/embed/' + track.id + '?' + params;
  frame.title = 'Плеер YouTube';
  frame.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
  frame.allowFullscreen = true;
  frame.referrerPolicy = 'strict-origin-when-cross-origin';
  get('screen').replaceChildren(frame);
  status('Загрузка видео…');
  loadTimeout = setTimeout(() => {
    status('Видео не загрузилось. Попробуйте нажать ▶ или выберите «Следующий».');
  }, 12000);
  player = new YT.Player(frame, {
    events: {
      onReady(event) {
        if (current !== track) return;
        event.target.playVideo();
      },
      onStateChange(event) {
        if (current !== track) return;
        if (event.data === YT.PlayerState.ENDED) { if(!stoppedByUser)next(); return; }
        if (event.data === YT.PlayerState.PLAYING) {
          clearTimeout(loadTimeout);
          const duration = event.target.getDuration?.() || 0;
          if (track.viewer && duration > MAX_TRACK_SECONDS) { status('Трек длиннее ' + MAX_TRACK_SECONDS/60 + ' минут — пропущен.'); next(); return; }
          const title = event.target.getVideoData?.()?.title;
          if (title) track.title = title;
          playing = track;
          publishNowPlaying();
          status('');
          render();
        } else if (event.data === YT.PlayerState.PAUSED && playing === track) {
          playing = null;
          render();
          publishNowPlaying();
        }
      },
      onAutoplayBlocked() {
        if (current !== track) return;
        clearTimeout(loadTimeout);
        status('Автозапуск заблокирован. Нажмите ▶ в плеере.');
      },
      onError(event) {
        if (current !== track) return;
        clearTimeout(loadTimeout);
        playing = null;
        publishNowPlaying();
        if (event.data !== 153) setTimeout(() => { if (current === track && !playing) next(); }, [2, 5, 100].includes(event.data) ? 3000 : 30000);
        if ([101, 150].includes(event.data)) {
          get('watch').href = 'https://www.youtube.com/watch?v=' + track.id;
          get('manual-title').value = event.target?.getVideoData?.()?.title || '';
          get('manual-start').disabled = false;
          get('manual').hidden = false;
          status('YouTube ' + event.data + ' · запустите видео на YouTube или нажмите «Следующий».');
          return;
        }
        if (event.data === 153) {
          status(location.protocol === 'file:'
            ? 'YouTube 153 · откройте плеер по HTTPS-ссылке из инструкции.'
            : 'YouTube 153 · откройте этот же адрес в Edge или Chrome для проверки.');
          return;
        }
        status('YouTube не воспроизводит это видео (' + event.data + '). Нажмите «Следующий».');
      }
    }
  });
}

get('manual').addEventListener('submit', event => {

  current.title = title;
  current.manual = true;

get('add').addEventListener('submit', async event => {

bot = sourmusicConnect({
  events:controlMode?null:undefined,
  onStatus:text=>{connectionIndicator(!controlMode && text.startsWith('Streamer.bot подключён'));if(controlMode&&!text.startsWith('Streamer.bot подключён')){remoteState=null;renderRemote();}},
  onReady:()=>{findRelay();pollSync();},
  onEvent:({event,data})=>{
    if(controlMode)return;
    if(String(event.source).toLowerCase()==='twitch'&&String(event.type).toLowerCase()==='chatmessage'){
      const login=String(data?.user?.login||data?.user?.name||data?.user_login||data?.userName||data?.message?.username||'').toLowerCase();
      if(!cloudInfo.enabled||!relaySender||login!==relaySender)return;
      const text=typeof data?.message==='string'?data.message:(data?.message?.text||data?.message?.message||data?.text||'');
      const parts=text.trim().split(/\s+/);
      if(parts.length!==4||parts[0].toLowerCase()!=='!addsourmusic'||!videoId(parts[1])||!/^\w{1,25}$/.test(parts[2])||! /^[a-zA-Z0-9-]{8,80}$/.test(parts[3]))return;
      const key='relay:'+login+':'+parts[3];if(seenOrders.has(key))return;
      if(enqueue(parts[1],parts[2],true)){seenOrders.add(key);if(seenOrders.size>500)seenOrders.delete(seenOrders.values().next().value);}
      return;
    }
    if(String(event.source).toLowerCase()!=='twitch'||String(event.type).toLowerCase()!=='rewardredemption')return;
    const name=String(data?.reward?.title ?? data?.rewardName ?? data?.rewardTitle ?? '').trim();
    const input=String(data?.user_input ?? data?.userInput ?? data?.rawInput ?? '').trim();
    const normal=s=>s.normalize('NFKC').replace(/\s+/g,' ').trim().toLowerCase();
    const note=message=>{get('orders').textContent='Заказы · v11 · '+new Date().toLocaleTimeString()+': '+message;publishNowPlaying();};
    if(normal(name)!==normal(rewardTitle)){note('Получена награда «'+name+'», ожидается «'+rewardTitle+'».');return;}
    if(!input){note('Заказ получен, но поле ссылки пустое. Поля события: '+Object.keys(data||{}).join(', '));return;}
    if(!videoId(input)){note('Заказ получен, но ссылка не распознана: '+input.slice(0,250));return;}
    const redemptionId=data.redemptionId ?? data.id;
    if(redemptionId && seenOrders.has(redemptionId)){note('Повтор того же заказа — уже обработан.');return;}
    const user=data.user?.displayName||data.user?.name||data.user?.login||data.user_name||data.user_login||data.userName||(typeof data.user==='string'?data.user:'Зритель');
    if(enqueue(input,user,true)){
      if(redemptionId){seenOrders.add(redemptionId);if(seenOrders.size>500)seenOrders.delete(seenOrders.values().next().value);}
      note('Добавлен трек '+videoId(input)+' · '+user);
    }else note('Заказ отклонён: '+get('status').textContent);
  }
});

const codeForStreamerBot="using System;\nusing Newtonsoft.Json;\nusing Newtonsoft.Json.Linq;\n\npublic class CPHInline\n{\n    private static readonly object Gate = new object();\n    public bool Execute()\n    {\n        lock (Gate)\n        {\n            try\n            {\n                string value;\n                long now = DateTimeOffset.UtcNow.ToUnixTimeMilliseconds();\n                if (CPH.TryGetArg<string>(\"sourmusicCommand\", out value))\n                {\n                    if (String.IsNullOrEmpty(value) || value.Length > 4096) return false;\n                    JObject command = JObject.Parse(value);\n                    string type = (string)command[\"type\"];\n                    if (type != \"next\" && type != \"stop\" && type != \"play\" && type != \"add\" && type != \"share\") return false;\n                    if (String.IsNullOrEmpty((string)command[\"id\"]) || String.IsNullOrEmpty((string)command[\"session\"])) return false;\n                    if (type == \"add\")\n                    {\n                        string url = (string)command[\"url\"];\n                        string viewer = (string)command[\"user\"];\n                        if (String.IsNullOrEmpty(url) || url.Length > 300 || (viewer != null && viewer.Length > 80)) return false;\n                    }\n                    command[\"at\"] = now;\n                    string saved = CPH.GetGlobalVar<string>(\"sourmusic.commands\", false);\n                    JArray commands;\n                    try { commands = String.IsNullOrEmpty(saved) ? new JArray() : JArray.Parse(saved); }\n                    catch (Exception parseError)\n                    {\n                        CPH.LogError(\"SourMusic: очередь команд повреждена и сброшена: \" + parseError.Message);\n                        commands = new JArray();\n                    }\n                    foreach (JToken item in commands) if ((string)item[\"id\"] == (string)command[\"id\"]) return true;\n                    commands.Add(command);\n                    while (commands.Count > 64) commands.RemoveAt(0);\n                    CPH.SetGlobalVar(\"sourmusic.commands\", commands.ToString(Formatting.None), false);\n                    return true;\n                }\n                if (!CPH.TryGetArg<string>(\"sourmusicState\", out value) || String.IsNullOrEmpty(value) || value.Length > 65536) return false;\n                JObject state = JObject.Parse(value);\n                state[\"at\"] = now;\n                CPH.SetGlobalVar(\"sourmusic.nowPlaying\", state.ToString(Formatting.None), false);\n                // Лёгкая копия для оверлея: только текущий трек.\n                JObject small = new JObject();\n                small[\"at\"] = now;\n                JToken track = state[\"track\"];\n                small[\"track\"] = track == null ? JValue.CreateNull() : track.DeepClone();\n                CPH.SetGlobalVar(\"sourmusic.track\", small.ToString(Formatting.None), false);\n                return true;\n            }\n            catch (Exception error)\n            {\n                CPH.LogError(\"SourMusic State: \" + error.Message);\n                return false;\n            }\n        }\n    }\n}\n";
async function copyValue(value){
 try{await navigator.clipboard.writeText(value);get('copy-result').textContent='Скопировано';get('copy-fallback').hidden=true;}
 catch{const field=get('copy-fallback');field.value=value;field.hidden=false;field.focus();field.select();get('copy-result').textContent='Нажмите Ctrl+C';}
}
